name: comictrakk
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  path: ^1.9.1
  collection: any

  sqflite: ^2.4.5
  sqflite_common_ffi: ^2.4.0
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  drift_dev: ^2.35.3

  flutter_bloc: ^9.1.1
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_slidable: ^5.2.0

  flutter_svg: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.8
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/batman-logo.svg


hooks:
  user_defines:
    sqlite3:
      source:
        linux: system
        default: sqlite3