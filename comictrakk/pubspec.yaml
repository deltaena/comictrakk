name: comictrakk
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  path: ^1.9.1

  sqflite: ^2.4.5
  sqflite_common_ffi: ^2.4.0

  flutter_bloc: ^9.1.1
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

  flutter_svg: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/batman-logo.svg


hooks:
  user_defines:
    sqlite3:
      source:
        linux: system
        default: sqlite3